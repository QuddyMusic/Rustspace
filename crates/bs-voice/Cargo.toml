[package]
name = "bs-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Захват камеры (nokhwa: V4L2 / Media Foundation / AVFoundation).
camera = ["dep:nokhwa"]

[dependencies]
bs-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
url = { workspace = true }
tracing = { workspace = true }
livekit = { version = "0.9.7", default-features = false, features = ["native", "rustls-tls-webpki-roots", "tokio", "glib-main-loop"] }
cpal = "0.18"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"
futures = "0.3"
