[package]
name = "bs-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Сервер Backspace на Rust, совместимый с оригинальным (клиенты, база, федерация)"

[lints]
workspace = true

[[bin]]
name = "backspace-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { workspace = true, features = ["process", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
bcrypt = "0.17"
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
zeroize = { workspace = true }
regex = "1"
base64 = "0.22"
bs-permissions = { workspace = true }
futures-util = { workspace = true }
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "3"
tokio-tungstenite = { workspace = true }
