[package]
name = "bs-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Сервер Rustspace на Rust, совместимый с оригинальным Backspace (клиенты, база, федерация)"

[lints]
workspace = true

[[bin]]
name = "rustspace-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { workspace = true, features = ["process", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
bcrypt = "0.17"
jsonwebtoken = "9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
subtle = "2"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.9"
zeroize = { workspace = true }
regex = "1"
base64 = "0.22"
bs-permissions = { workspace = true }
futures-util = { workspace = true }
httpdate = "1"
postgres = "0.19"
reqwest = { workspace = true }
url = { workspace = true }
scraper = { version = "0.23", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = "0.14"
tokio-postgres = "0.7"

tokio-tungstenite = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
