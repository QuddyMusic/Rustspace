[package]
name = "bs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rustspace — неофициальный клиент на Rust, совместимый с Backspace (GUI)"
homepage = "https://github.com/QuddyMusic/Rustspace"

[lints]
workspace = true

[[bin]]
name = "rustspace"
path = "src/main.rs"

# Упаковка: `cargo packager --release -p bs-app --formats deb,appimage`
# (Linux), `--formats dmg` (macOS), `--formats nsis` (Windows).
[package.metadata.packager]
product-name = "Rustspace"
authors = ["Rustspace contributors"]
identifier = "io.github.quddymusic.rustspace"
category = "SocialNetworking"
description = "Rustspace: неофициальный клиент, совместимый с Backspace (чат, ЛС, пространства и голос)"
icons = ["../../packaging/linux/rustspace.png"]
before-packaging-command = "cargo build --release -p bs-app --features voice"
out-dir = "../../target/packages"
binaries = [{ path = "rustspace", main = true }]

[package.metadata.packager.deb]
# libasound — звук, libdbus — хранилище ключей и уведомления, libxkbcommon/
# libwayland/libGL — окно. libwebrtc вшита статически.
depends = ["libasound2 | libasound2t64", "libdbus-1-3", "libxkbcommon0", "libwayland-client0", "libgl1"]
section = "net"
desktop-template = "../../packaging/linux/io.github.quddymusic.Rustspace.desktop"

[package.metadata.packager.appimage]
bins = []

[features]
# Голос через LiveKit: нужна libwebrtc (скачивается при сборке `webrtc-sys`).
voice = ["dep:bs-voice", "sounds"]
# Камера (nokhwa); вместе с голосом.
camera = ["voice", "bs-voice/camera"]
# Звуки интерфейса (rodio): нужна библиотека ALSA на Linux (libasound2-dev).
sounds = ["dep:rodio"]
# Глобальные горячие клавиши (X11, Windows, macOS; под Wayland — только в окне).
global-hotkeys = ["dep:global-hotkey", "dep:zbus"]
# Значок в трее и сворачивание в него; на Linux нужны GTK 3 и appindicator.
tray = ["dep:tray-icon", "dep:gtk"]
# Активность: музыка из плееров по MPRIS (D-Bus) на Linux. Игры и Rich
# Presence работают и без неё.
presence = ["dep:zbus"]
# Всё настольное разом.
desktop = ["global-hotkeys", "tray", "presence"]

[dependencies]
ruzstd = "0.9.1"
whatlang = "0.18"
bs-voice = { workspace = true, optional = true }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bs-api = { workspace = true }
bs-core = { workspace = true }
bs-instances = { workspace = true }
bs-media = { workspace = true }
bs-identity = { workspace = true }
bs-e2ee = { path = "../bs-e2ee" }
bs-types = { workspace = true }
bs-permissions = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
# QR-код ключа двухфакторной защиты (MIT/Apache-2.0).
qrcode = { version = "0.14", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
bs-rt = { path = "../bs-rt" }
# Время, которое работает и в браузере (там `std::time::Instant` падает).
web-time = "1"
semver = "1"
sha2 = "0.10"
global-hotkey = { version = "0.10", optional = true }
# Без libxdo: в меню трея только свои пункты и разделители, а libxdo
# нет в ряде дистрибутивов по умолчанию.
tray-icon = { version = "0.24", optional = true, default-features = false, features = ["gtk"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# Иконки игр: значки из .exe (ICO), PNG и JPEG с диска.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico", "webp"] }

# Настольная сборка: свой runtime, файлы, системные службы.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Перевод без LLM: модели Firefox Translations на Rust (MPL-2.0) и определение языка (MIT).
fxtranslate = { version = "0.5", features = ["icu-segmenter"] }
# Открыть скачанный файл или показать его в файловом менеджере (MIT/Apache-2.0).
opener = { version = "0.9", features = ["reveal"] }
tokio = { workspace = true }
arboard = { workspace = true }
# Обновление изнутри: архив релиза и его контрольная сумма.
flate2 = "1"
tar = "0.4"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Сборки llama.cpp под Windows приходят архивом zip.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Сборка для браузера (eframe WebRunner): задачи в цикле событий страницы,
# хранилище — localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
web-sys = { version = "0.3", features = ["Window", "Document", "console", "Storage", "Location", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Notification", "NotificationOptions", "NotificationPermission", "HtmlInputElement", "FileList", "File", "Event", "EventTarget"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
chrono = { workspace = true, features = ["wasmbind"] }

[target.'cfg(not(any(target_os = "linux", target_arch = "wasm32")))'.dependencies]
# Список процессов для поиска игр на Windows и macOS (на Linux — /proc).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# Имя приложения для уведомлений (AppUserModelID в реестре пользователя).
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
# Портал GlobalShortcuts под Wayland.
zbus = { version = "5.13", optional = true }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio-tungstenite = { workspace = true, features = ["handshake"] }
futures-util = { workspace = true }
