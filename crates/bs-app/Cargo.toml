[package]
name = "bs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "backspace-rs"
path = "src/main.rs"

[features]
# Голос через LiveKit: нужна libwebrtc (скачивается при сборке `webrtc-sys`).
voice = ["dep:bs-voice"]

[dependencies]
bs-voice = { workspace = true, optional = true }
serde_json = { workspace = true }
bs-api = { workspace = true }
bs-core = { workspace = true }
bs-instances = { workspace = true }
bs-media = { workspace = true }
bs-identity = { workspace = true }
bs-types = { workspace = true }
tokio = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio-tungstenite = { workspace = true, features = ["handshake"] }
futures-util = { workspace = true }
