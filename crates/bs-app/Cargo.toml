[package]
name = "bs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Нативный клиент Backspace на Rust (GUI)"
homepage = "https://github.com/TheZwiss/backspace"

[lints]
workspace = true

[[bin]]
name = "backspace-rs"
path = "src/main.rs"

# Упаковка: `cargo packager --release -p bs-app --formats deb,appimage`
# (Linux), `--formats dmg` (macOS), `--formats nsis` (Windows).
[package.metadata.packager]
product-name = "Backspace RS"
authors = ["Backspace RS contributors"]
identifier = "io.github.thezwiss.backspace-rs"
category = "SocialNetworking"
description = "Нативный клиент Backspace: чат, ЛС, пространства и голос"
icons = ["../../packaging/linux/backspace-rs.png"]
before-packaging-command = "cargo build --release -p bs-app --features voice"
out-dir = "../../target/packages"
binaries = [{ path = "backspace-rs", main = true }]

[package.metadata.packager.deb]
# libasound — звук, libdbus — хранилище ключей и уведомления, libxkbcommon/
# libwayland/libGL — окно. libwebrtc вшита статически.
depends = ["libasound2 | libasound2t64", "libdbus-1-3", "libxkbcommon0", "libwayland-client0", "libgl1"]
section = "net"
desktop-template = "../../packaging/linux/dev.backspace_rs.BackspaceRs.desktop"

[package.metadata.packager.appimage]
bins = []

[features]
# Голос через LiveKit: нужна libwebrtc (скачивается при сборке `webrtc-sys`).
voice = ["dep:bs-voice", "sounds"]
# Камера (nokhwa); вместе с голосом.
camera = ["voice", "bs-voice/camera"]
# Звуки интерфейса (rodio): нужна библиотека ALSA на Linux (libasound2-dev).
sounds = ["dep:rodio"]
# Глобальные горячие клавиши (X11, Windows, macOS; под Wayland — только в окне).
global-hotkeys = ["dep:global-hotkey", "dep:zbus"]
# Значок в трее и сворачивание в него; на Linux нужны GTK 3 и appindicator.
tray = ["dep:tray-icon", "dep:gtk"]
# Всё настольное разом.
desktop = ["global-hotkeys", "tray"]

[dependencies]
bs-voice = { workspace = true, optional = true }
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
bs-api = { workspace = true }
bs-core = { workspace = true }
bs-instances = { workspace = true }
bs-media = { workspace = true }
bs-identity = { workspace = true }
bs-types = { workspace = true }
bs-permissions = { workspace = true }
tokio = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
semver = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
global-hotkey = { version = "0.10", optional = true }
# Без libxdo: в меню трея только свои пункты и разделители, а libxdo
# нет в ряде дистрибутивов по умолчанию.
tray-icon = { version = "0.24", optional = true, default-features = false, features = ["gtk"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
# Портал GlobalShortcuts под Wayland.
zbus = { version = "5.13", optional = true }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio-tungstenite = { workspace = true, features = ["handshake"] }
futures-util = { workspace = true }
