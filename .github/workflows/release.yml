name: Release

# Тег vX.Y.Z (совпадает с version в Cargo.toml) → сборки сервера и клиента →
# черновик релиза на GitHub. Черновик проверяют и публикуют вручную: клиент
# и setup.sh видят только опубликованные релизы.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег существующего коммита, например v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    name: тег = версия в Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::тег $TAG не совпадает с версией $version в Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server:
    name: сервер (linux-${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Статическая сборка (musl): один файл для Debian, Ubuntu и Alpine.
      - name: musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.arch }}
      - name: cargo build
        run: cargo build --release --locked -p bs-server --target "$TARGET"
      - name: архив
        run: |
          name="rustspace-server-linux-${{ matrix.arch }}"
          mkdir -p stage dist
          cp "target/$TARGET/release/rustspace-server" stage/
          cp packaging/server/setup.sh LICENSE NOTICE README.md stage/
          tar czf "dist/$name.tar.gz" -C stage .
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          file "stage/rustspace-server"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: dist/*

  client:
    name: клиент (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Старый glibc: бинарник запустится и на не самых свежих системах.
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
          - name: windows-x86_64
            runner: windows-latest
          - name: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # libwebrtc (голос) требует clang 21+, а трей, звук и захват — системные
      # заголовки. На macOS и Windows всё нужное уже есть в образе.
      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libxkbcommon-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libwayland-dev libx11-dev libxrandr-dev libxcb1-dev libegl1-mesa-dev libglib2.0-dev \
            libva-dev libdrm-dev libxext-dev libxfixes-dev libxdamage-dev libxcomposite-dev libxtst-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.name }}
      - name: cargo build
        run: cargo build --release --locked -p bs-app --features voice,camera,desktop
      - name: архив (Linux)
        if: runner.os == 'Linux'
        run: |
          name="rustspace-${{ matrix.name }}"
          mkdir -p "stage/$name" dist
          cp target/release/rustspace "stage/$name/"
          cp packaging/linux/io.github.quddymusic.Rustspace.desktop packaging/linux/rustspace.png \
             packaging/linux/install.sh LICENSE NOTICE README.md "stage/$name/"
          tar czf "dist/$name.tar.gz" -C stage "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      # Пакет для Debian и Ubuntu: apt install ./rustspace-linux-*.deb
      - name: deb
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.name }}" in *aarch64) deb_arch=arm64 ;; *) deb_arch=amd64 ;; esac
          version="${{ needs.version.outputs.version }}"
          root="deb/rustspace"
          install -Dm755 target/release/rustspace "$root/usr/bin/rustspace"
          install -Dm644 packaging/linux/io.github.quddymusic.Rustspace.desktop \
            "$root/usr/share/applications/io.github.quddymusic.Rustspace.desktop"
          install -Dm644 packaging/linux/rustspace.png \
            "$root/usr/share/icons/hicolor/256x256/apps/rustspace.png"
          install -Dm644 LICENSE "$root/usr/share/doc/rustspace/copyright"
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: rustspace
          Version: $version
          Architecture: $deb_arch
          Maintainer: Quddy <quddymusic@proton.me>
          Homepage: https://github.com/${{ github.repository }}
          Section: net
          Priority: optional
          Depends: libgtk-3-0 | libgtk-3-0t64, libayatana-appindicator3-1, libasound2 | libasound2t64, libpipewire-0.3-0 | libpipewire-0.3-0t64, libdbus-1-3, libxkbcommon0, libgbm1, libva2, libdrm2
          Description: Rustspace — неофициальный клиент, совместимый с Backspace
           Чат, личные сообщения, пространства, голос и демонстрация экрана.
          EOF
          sed -i 's/^          //' "$root/DEBIAN/control"
          name="rustspace-${{ matrix.name }}.deb"
          dpkg-deb --build --root-owner-group "$root" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      # AppImage: один файл, запускается без установки и обновляется сам.
      - name: AppImage
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          case "${{ matrix.name }}" in *aarch64) ai_arch=aarch64 ;; *) ai_arch=x86_64 ;; esac
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$ai_arch.AppImage" -O linuxdeploy
          chmod +x linuxdeploy
          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=$ai_arch
          export LDAI_OUTPUT="dist/Rustspace-$ai_arch.AppImage"
          ./linuxdeploy --appdir AppDir \
            --executable target/release/rustspace \
            --desktop-file packaging/linux/io.github.quddymusic.Rustspace.desktop \
            --icon-file packaging/linux/rustspace.png \
            --output appimage
          (cd dist && sha256sum "Rustspace-$ai_arch.AppImage" > "Rustspace-$ai_arch.AppImage.sha256")
      - name: архив (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rustspace-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "stage/$name", dist | Out-Null
          Copy-Item target/release/rustspace.exe, LICENSE, NOTICE, README.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "dist/$name.zip.sha256"
      # Установщик: ставит в профиль пользователя, клиент потом обновляется сам.
      - name: установщик (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ needs.version.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging/windows/rustspace.iss
          $name = "rustspace-setup-x86_64.exe"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "dist/$name.sha256"
      - name: архив (macOS)
        if: runner.os == 'macOS'
        run: |
          name="rustspace-${{ matrix.name }}"
          version="${{ needs.version.outputs.version }}"
          app="stage/Rustspace.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp target/release/rustspace "$app/Contents/MacOS/"
          cp LICENSE NOTICE "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Rustspace</string>
            <key>CFBundleDisplayName</key><string>Rustspace</string>
            <key>CFBundleIdentifier</key><string>io.github.quddymusic.rustspace</string>
            <key>CFBundleExecutable</key><string>rustspace</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Голосовые звонки</string>
            <key>NSCameraUsageDescription</key><string>Видеозвонки</string>
          </dict></plist>
          EOF
          # Подпись без сертификата (ad-hoc): без неё arm64 не запустит бинарник.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.name }}
          path: dist/*

  release:
    name: черновик релиза
    needs: [version, server, client]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Заметки к выпуску
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          > Rustspace — неофициальный клиент и сервер на Rust, совместимые с Backspace.
          > Официальный репозиторий Backspace: https://github.com/TheZwiss/backspace

          ## Клиент

          | Система | Файл |
          |---|---|
          | Linux, любой дистрибутив | одной командой: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/packaging/linux/install.sh \| sh\` |
          | Linux, AppImage | \`Rustspace-*.AppImage\` — сделайте исполняемым и запустите |
          | Debian / Ubuntu | \`sudo apt install ./rustspace-linux-x86_64.deb\` |
          | Arch | \`packaging/arch/PKGBUILD\` (rustspace-bin): \`makepkg -si\` |
          | Linux, архив | \`rustspace-linux-*.tar.gz\` — распакуйте и запустите \`install.sh\` или сам \`rustspace\` |
          | Windows x86_64 | \`rustspace-setup-x86_64.exe\` — установщик; \`rustspace-windows-x86_64.zip\` — без установки |
          | macOS (Apple Silicon) | \`rustspace-macos-aarch64.zip\` — сборка без сертификата Apple: первый запуск через «Открыть» в контекстном меню |

          ## Сервер

          Установка или обновление одной командой (Debian, Ubuntu, Alpine; x86_64 и aarch64):

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/v$VERSION/packaging/server/setup.sh \\
            | sudo sh -s -- --release $VERSION --domain ВАШ.ДОМЕН
          \`\`\`

          Файлы \`*.sha256\` — контрольные суммы; \`setup.sh\` и клиент проверяют их сами.

          Клиент, поставленный установщиком, \`install.sh\`, AppImage или из архива, обновляется
          сам: кнопка «Обновить» в полосе о новой версии. Пакеты (deb, Arch) обновляет менеджер пакетов.

          ## Изменения
          EOF
          # Раздел этой версии из CHANGELOG.md (между её заголовком и следующим).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            /^\[[0-9]/ { next }
            on' CHANGELOG.md >> notes.md
      - name: Черновик
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --draft \
            --verify-tag \
            --title "Rustspace $VERSION" \
            --notes-file notes.md \
            --generate-notes
