name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libwebrtc (голос) требует clang 21+, а keyring/звук/захват — системные
      # заголовки. На macOS и Windows всё нужное уже есть в образе.
      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus libasound2-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libxkbcommon-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libwayland-dev libx11-dev libxrandr-dev libxcb1-dev libegl1-mesa-dev libglib2.0-dev \
            libva-dev libdrm-dev libxext-dev libxfixes-dev libxdamage-dev libxcomposite-dev libxtst-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: portal GlobalShortcuts (своя шина D-Bus)
        run: dbus-run-session -- cargo test -p bs-app --all-features portal_keys -- --ignored

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libxkbcommon-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libwayland-dev libx11-dev libxrandr-dev libxcb1-dev libegl1-mesa-dev libglib2.0-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"
      - run: cargo doc --workspace --no-deps --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  contract:
    name: контракт с настоящим сервером Backspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TheZwiss/backspace
          path: backspace-upstream
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости сервера
        working-directory: backspace-upstream
        run: |
          npm install -g pnpm@10
          pnpm install --filter @backspace/server... --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask contract
        run: cargo xtask contract --server backspace-upstream
